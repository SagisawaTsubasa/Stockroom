name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  import-check:
    name: Import under real HA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Home Assistant
        run: pip install homeassistant==2026.1.3
      - name: Import every platform module
        run: |
          python - <<'EOF'
          import custom_components.stockroom
          import custom_components.stockroom.sensor
          import custom_components.stockroom.binary_sensor
          import custom_components.stockroom.config_flow
          import custom_components.stockroom.bambu
          print("all stockroom modules import cleanly under real HA")
          EOF
