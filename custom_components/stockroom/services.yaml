  fields:
    entry_id:
      name: 配置项 ID
      description: 配置了多个仓库时指定目标仓库；单仓库时可省略。
      required: false
      selector:
        text:
    item:
      name: 条目
      description: 条目 ID（精确优先），或名称唯一匹配；歧义时报错。
      required: true
      selector:
        text:
    actual:
      name: 实际数量
      description: 实际清点到的数量（可以为 0）。
      required: true
